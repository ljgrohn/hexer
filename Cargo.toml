[package]
name = "hexer"
version = "0.1.1"
edition = "2024"
description = "Super simple Windows color picker: point at a pixel, get its codes."
repository = "https://github.com/ljgrohn/hexer"
readme = "README.md"
publish = false

[dependencies]
eframe = "0.36"
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
